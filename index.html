<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KFTools — Ferramentas Online</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#080b09;
    --surface:#101512;
    --surface2:#151b17;
    --border:#263129;
    --green:#65c96b;
    --green2:#8be38f;
    --text:#f3f5f3;
    --muted:#9ba59d;
    --danger:#d85c5c;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

header{
    background:#0b0e0c;
    border-bottom:1px solid #1d251f;
    padding:20px 6%;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:29px;
    font-weight:800;
    letter-spacing:-1px;
}

.logo span{
    color:var(--green);
}

nav{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:16px;
}

nav button{
    background:#111612;
    color:#bfc7c1;
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px 15px;
    cursor:pointer;
    transition:.2s;
}

nav button:hover,
nav button.active{
    background:#17331d;
    border-color:#3e7544;
    color:var(--green2);
}

.container{
    width:92%;
    max-width:1200px;
    margin:35px auto;
}

.tool{
    display:none;
}

.tool.active{
    display:block;
}

.hero{
    margin-bottom:24px;
}

.hero h1{
    font-size:34px;
    margin-bottom:10px;
}

.hero p{
    color:var(--muted);
    line-height:1.6;
}

.card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
}

label{
    display:block;
    color:#e0e7e1;
    font-weight:bold;
    margin-bottom:8px;
}

input,
textarea,
select{
    width:100%;
    background:#090c0a;
    color:#fff;
    border:1px solid #303b33;
    border-radius:10px;
    padding:12px;
    font-size:15px;
    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:var(--green);
}

textarea{
    min-height:180px;
    resize:vertical;
    line-height:1.5;
}

.row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.row > *{
    flex:1;
    min-width:180px;
}

.btn{
    background:var(--green);
    color:#071008;
    border:none;
    border-radius:10px;
    padding:12px 17px;
    font-weight:bold;
    cursor:pointer;
    margin:5px 4px 5px 0;
}

.btn:hover{
    background:#82e387;
}

.btn.secondary{
    background:#172019;
    color:#d2dad4;
    border:1px solid #344238;
}

.btn.secondary:hover{
    background:#223027;
}

.btn.danger{
    background:#35191b;
    color:#ffaaaa;
    border:1px solid #683033;
}

.toolbar{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    padding:10px;
    background:#0b0e0c;
    border:1px solid #263029;
    border-radius:10px 10px 0 0;
}

.toolbar button{
    background:#171d19;
    color:#ddd;
    border:1px solid #303a33;
    padding:8px 10px;
    border-radius:7px;
    cursor:pointer;
}

.toolbar button:hover{
    background:#26352a;
}

.editor{
    min-height:250px;
    padding:18px;
    background:#fff;
    color:#111;
    border-radius:0 0 10px 10px;
    outline:none;
    line-height:1.6;
}

.preview{
    background:#fff;
    color:#111;
    border-radius:12px;
    padding:25px;
    min-height:300px;
    overflow:auto;
}

.cv-preview{
    max-width:850px;
    margin:auto;
    background:#fff;
    color:#111;
    padding:45px;
    min-height:900px;
}

.cv-preview h1{
    font-size:32px;
    margin-bottom:5px;
}

.cv-preview h2{
    font-size:19px;
    margin-top:25px;
    border-bottom:2px solid #222;
    padding-bottom:5px;
}

.cv-preview p{
    margin:7px 0;
    line-height:1.5;
}

.photo-preview{
    width:130px;
    height:130px;
    object-fit:cover;
    border-radius:12px;
    display:none;
    margin-top:10px;
}

.hidden{
    display:none!important;
}

.badge{
    display:inline-block;
    background:#142319;
    border:1px solid #304f35;
    color:#86d98b;
    padding:6px 9px;
    border-radius:30px;
    font-size:12px;
    margin:3px;
}

.style-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
    margin-top:10px;
}

.style-option{
    background:#0b0f0c;
    border:1px solid #2b372e;
    border-radius:10px;
    padding:13px;
    color:#bbb;
    cursor:pointer;
    text-align:center;
    transition:.2s;
}

.style-option:hover{
    border-color:#4c7651;
}

.style-option.selected{
    border-color:var(--green);
    background:#142319;
    color:var(--green2);
}

.loading{
    padding:15px;
    text-align:center;
    color:var(--green2);
}

footer{
    text-align:center;
    color:#69716b;
    padding:35px;
    margin-top:50px;
}
</head>

<body>

<header>

  <div class="logo">
    KF<span>Tools</span>
  </div>

  <nav>

    <button
      class="active"
      onclick="abrirFerramenta('pdf',this)"
    >
      Texto → PDF
    </button>

    <button
      onclick="abrirFerramenta('cv',this)"

<main class="container">


<!-- ================= TEXTO PARA PDF ================= -->

<section id="pdf" class="tool active">

  <div class="hero">

    <h1>Texto para PDF</h1>

    <p>
      Escreva, formate e transforme seu texto em um PDF.
    </p>

  </div>


  <div class="card">

    <div class="toolbar">

      <button onclick="formatar('bold')">
        <b>B</b>
      </button>

      <button onclick="formatar('italic')">
        <i>I</i>
      </button>

      <button onclick="formatar('underline')">
        <u>U</u>
      </button>

      <button onclick="formatar('justifyLeft')">
        Esquerda
      </button>

      <button onclick="formatar('justifyCenter')">
        Centro
      </button>

      <button onclick="formatar('justifyRight')">
        Direita
      </button>

      <button onclick="formatar('justifyFull')">
        Justificar
      </button>

      <button onclick="alterarTamanho(-2)">
        A−
      </button>

      <button onclick="alterarTamanho(2)">
        A+
      </button>

      <input
        type="color"
        id="corTexto"
        value="#111111"
        onchange="document.execCommand('foreColor',false,this.value)"
        style="width:45px;padding:3px"
      >

    </div>


    <div
      id="editor"
      class="editor"
      contenteditable="true"
      spellcheck="true"
    >
      Digite ou cole seu texto aqui...
    </div>


    <br>


    <label>
      Adicionar imagem
    </label>

    <input
      type="file"
      id="fotoPDF"
      accept="image/*"
    >

    <img
      id="previewFotoPDF"
      class="photo-preview"
    >


    <br>


    <button
      class="btn"
      onclick="previewPDF()"
    >
      Visualizar PDF
    </button>

    <button
      class="btn secondary"
      onclick="salvarPDF()"
    >
      Salvar PDF
    </button>

    <button
      class="btn danger"
      onclick="limparPDF()"
    >
      Limpar
    </button>

  </div>


  <div
    id="pdfPreview"
    class="preview hidden"
  ></div>

</section>



<!-- ================= CURRÍCULO ================= -->

<section id="cv" class="tool">

  <div class="hero">

    <h1>Criador de Currículo</h1>

    <p>
      Monte um currículo profissional e pronto para enviar.

  </div>


  <div class="card">

        <label>

    </div>


    <br>


    <div class="row">

        <label>

        </label>

          id="cvEmail"

        >

      </div>


      <div>

        <label>
          Telefone
        </label>

        <input
          id="cvTelefone"
          placeholder="(00) 00000-0000"
        >

      </div>

    </div>


    <br>


    <div class="row">

      <div>

        <label>
          Cidade
        </label>

        <input
          id="cvCidade"

        >

      </div>


      <div>

        <label>
          LinkedIn
        </label>

        <input
          id="cvLinkedin"

    </div>


    <br>


    <label>
      Resumo profissional
    </label>

    <textarea
      id="cvResumo"

    ></textarea>


    <br>


    <label>
      Formação
    </label>

    <textarea
      id="cvFormacao"
      placeholder="Curso, instituição e período..."
    ></textarea>


    <br>


    <label>
      Experiência profissional
    </label>

    <textarea
      id="cvExperiencia"

    ></textarea>

    <label>
      Cursos e habilidades

    <textarea
      id="cvCursos"

    <br>


    <button

      Gerar currículo
    </button>

    <button
      class="btn secondary"

      Salvar PDF
    </button>

    <button
      class="btn danger"
      onclick="limparCV()"
    >
      Limpar
    </button>

  </div>


  <div class="card">

    <h2 style="margin-bottom:15px">
      Pré-visualização
    </h2>

    <div
      id="cvPreview"
      class="cv-preview"
    >

      <h1>
        Seu Nome
      </h1>

      <p>
        Seu objetivo profissional
      </p>

      <h2>
        Contato
      </h2>

      <p>
        Preencha seus dados acima.
      </p>

      <h2>
        Resumo profissional
      </h2>

      <p>
        Seu resumo aparecerá aqui.
      </p>

    </div>

  </div>

</section>


<!-- ================= SLIDES ================= -->

<section id="slides" class="tool">

  <div class="hero">

    <h1>
      Criador de Slides
    </h1>

    <p>
      Crie apresentações automaticamente usando

    </p>

    <div style="margin-top:12px">

      <span class="badge">

      <span class="badge">

    <br>

    <button

    <button
      class="btn secondary"

    <button
      class="btn secondary"

      Salvar projeto
    </button>

    <button
      class="btn secondary"

      Baixar projeto
    </button>

    <button

      onclick="document.getElementById('arquivoProjeto').click()"

      Abrir projeto
    </button>

    <input

    <button
      class="btn secondary"
      onclick="exportarSlidesPDF()"
    >
      Exportar PDF
    </button>

    <button
      class="btn danger"
      onclick="limparSlides()"
    >
      Limpar
    </button>

  </div>

  <div id="slidesStatus"></div>

  <div
    id="slidesArea"
    class="slides-area"
  ></div>

</section>

<script>

/* ================= NAVEGAÇÃO ================= */

function abrirFerramenta(id,botao){

    document
        .querySelectorAll('.tool')
        .forEach(el => el.classList.remove('active'));

    const ferramenta = document.getElementById(id);

    if(ferramenta){
        ferramenta.classList.add('active');
    }

    document
        .querySelectorAll('nav button')
        .forEach(btn => btn.classList.remove('active'));

    if(botao){
        botao.classList.add('active');
    }

}


/* ================= EDITOR PDF ================= */

function formatar(comando){

    document.execCommand(comando,false,null);

    document.getElementById('editor').focus();

}


function alterarTamanho(valor){

    document.execCommand(
        'fontSize',
        false,
        valor > 0 ? '5' : '2'
    );

    document.getElementById('editor').focus();

}


function previewPDF(){

    const editor =
        document.getElementById('editor');

    const preview =
        document.getElementById('pdfPreview');

    preview.innerHTML =
        editor.innerHTML;

    preview.classList.remove('hidden');

}


function limparPDF(){

    document.getElementById('editor').innerHTML =
        'Digite ou cole seu texto aqui...';

    document
        .getElementById('pdfPreview')
        .classList.add('hidden');

    document.getElementById('fotoPDF').value='';

    document.getElementById('previewFotoPDF').style.display='none';

}


/* ================= IMAGEM PDF ================= */

document
    .getElementById('fotoPDF')
    ?.addEventListener('change',function(){

        const arquivo = this.files[0];

        if(!arquivo) return;

        const imagem =
            document.getElementById('previewFotoPDF');

        imagem.src =
            URL.createObjectURL(arquivo);

        imagem.style.display='block';

    });

    const el =

}

    return String(texto || '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;')
        .replace(/\n/g,'<br>');

}

let janelaApresentacao = null;


function apresentarSlides(){

    if(!slides.length){

        alert(
            'Crie pelo menos um slide primeiro.'
        );

        return;
    }


    indiceApresentacao = 0;


    const tela =
        document.createElement('div');

    tela.className = 'presentation';

    tela.id = 'presentation';


    tela.innerHTML = `

        <div class="presentation-inner">

            <div id="presentationSlide"></div>

            <div class="presentation-controls">

                <button
                    onclick="slideAnterior()"
                >
                    ← Anterior
                </button>

                <button
                    onclick="slideProximo()"
                >
                    Próximo →
                </button>

                <button
                    onclick="fecharApresentacao()"
                >
                    ✕ Fechar
                </button>

            </div>

        </div>

    `;


    document.body.appendChild(tela);


    mostrarSlideApresentacao();


    document.addEventListener(
        'keydown',
        tecladoApresentacao
    );

}


function mostrarSlideApresentacao(){

    const area =
        document.getElementById(
            'presentationSlide'
        );


    if(!area || !slides[indiceApresentacao])
        return;


    const slide =
        slides[indiceApresentacao];


    const estilo =
        slide.estilo ||
        estiloSlide;


    let conteudo='';


    if(
        estilo === 'full' &&
        slide.imagem
    ){

        conteudo = `

            <div class="slide-full">

                <img
                    src="${slide.imagem}"
                    alt=""
                >

                <div class="overlay">

                    <h2>
                        ${escapar(slide.titulo)}
                    </h2>

                    <p>
                        ${escapar(slide.conteudo)}
                    </p>

                </div>

            </div>

        `;

    }else if(
        estilo === 'right' &&
        slide.imagem){

    conteudo = `

        <div class="slide-right">

            <div class="slide-content">

                <h2>
                    ${escapar(slide.titulo)}
                </h2>

                <p>
                    ${escapar(slide.conteudo)}
                </p>

            </div>

            <img
                src="${slide.imagem}"
                alt=""
            >

        </div>

    `;

}else if(estilo === 'text'){

    conteudo = `

        <div class="slide-text-only">

            <div class="slide-content">

                <h2>
                    ${escapar(slide.titulo)}
                </h2>

                <p>
                    ${escapar(slide.conteudo)}
                </p>

            </div>

        </div>

    `;

}else{

    conteudo = `

        <div class="slide-content">

            <h2>
                ${escapar(slide.titulo)}
            </h2>

            <p>
                ${escapar(slide.conteudo)}
            </p>

            ${
                slide.imagem
                ? `
                    <img
                        src="${slide.imagem}"
                        class="slide-image"
                        alt=""
                    >
                  `
                : ''
            }

        </div>

    `;

}


area.innerHTML = `

    <div class="slide-canvas">

        ${conteudo}

    </div>

    <div
        style="
            text-align:center;
            color:#aaa;
            margin-top:10px;
            font-size:13px;
        "
    >
        Slide ${indiceApresentacao + 1}
        de ${slides.length}
    </div>

`;

}


/* ================= SLIDE ANTERIOR ================= */

function slideAnterior(){

    if(indiceApresentacao > 0){

        indiceApresentacao--;

        mostrarSlideApresentacao();

    }

}


/* ================= PRÓXIMO SLIDE ================= */

function slideProximo(){

    if(
        indiceApresentacao <
        slides.length - 1
    ){

        indiceApresentacao++;

        mostrarSlideApresentacao();

    }

}


/* ================= TECLADO ================= */

function tecladoApresentacao(event){

    const tela =
        document.getElementById(
            'presentation'
        );

    if(!tela)
        return;

    if(event.key === 'ArrowRight'){

        slideProximo();

    }

    if(event.key === 'ArrowLeft'){

        slideAnterior();

    }

    if(event.key === 'Escape'){

        fecharApresentacao();

    }

}


/* ================= FECHAR APRESENTAÇÃO ================= */

function fecharApresentacao(){

    const tela =
        document.getElementById(
            'presentation'
        );

    if(tela){

        tela.remove();

    }

    document.removeEventListener(
        'keydown',
        tecladoApresentacao
    );

}


/* ================= SALVAR PROJETO ================= */

function salvarProjeto(){

    if(!slides.length){

        alert(
            'Não há slides para salvar.'
        );

        return;

    }

    const projeto = {

        nome:'KFTools',

        versao:'1.0',

        estilo:estiloSlide,

        slides:slides

    };

    try{

        localStorage.setItem(
            'KFToolsProjeto',
            JSON.stringify(projeto)
        );

        document.getElementById(
            'slidesStatus'
        ).innerHTML =
            `<div class="status-ok">
                Projeto salvo neste dispositivo.
            </div>`;

    }catch(erro){

        alert(
            'Não foi possível salvar o projeto.'
        );

    }

}


/* ================= BAIXAR PROJETO ================= */

function baixarProjeto(){

    if(!slides.length){

        alert(
            'Não há slides para baixar.'
        );

        return;

    }

    const projeto = {

        nome:'KFTools',

        versao:'1.0',

        estilo:estiloSlide,

        slides:slides

    };

    const dados =
        JSON.stringify(
            projeto,
            null,
            2
        );

    const arquivo =
        new Blob(
            [dados],
            {
                type:'application/json'
            }
        );

    const url =
        URL.createObjectURL(
            arquivo
        );

    const link =
        document.createElement('a');

    link.href = url;

    link.download =
        'KFTools-projeto.json';

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

}


/* ================= ABRIR PROJETO ================= */

function abrirProjeto(event){

    const arquivo =
        event.target.files?.[0];

    if(!arquivo)
        return;

    const leitor =
        new FileReader();

    leitor.onload = function(){

        try{

            const projeto =
                JSON.parse(
                    leitor.result
                );

            if(
                !projeto ||
                !Array.isArray(
                    projeto.slides
                )
            ){

                throw new Error(
                    'Formato inválido'
                );

            }

            slides =
                projeto.slides.map(slide => ({

                    titulo:
                        slide.titulo ||
                        'Novo slide',

                    conteudo:
                        slide.conteudo ||
                        '',

                    imagem:
                        slide.imagem ||
                        '',

                    fonte:
                        slide.fonte ||
                        '',

                    pagina:
                        slide.pagina ||
                        '',

                    autor:
                        slide.autor ||
                        '',

                    licenca:
                        slide.licenca ||
                        '',

                    estilo:
                        slide.estilo ||
                        projeto.estilo ||
                        'classic'

                }));

            estiloSlide =
                projeto.estilo ||
                'classic';

            document
                .querySelectorAll(
                    '.style-option'
                )
                .forEach(el => {

                    el.classList.toggle(
                        'selected',
                        el.dataset.style ===
                        estiloSlide
                    );

                });

            renderizarSlides();

            document.getElementById(
                'slidesStatus'
            ).innerHTML =
                `<div class="status-ok">
                    Projeto aberto com sucesso.
                </div>`;

        }catch(erro){

            alert(
                'Esse arquivo não é um projeto KFTools válido.'
            );

        }

    };

    leitor.readAsText(
        arquivo
    );

    event.target.value='';

}


/* ================= LIMPAR SLIDES ================= */

function limparSlides(){

    if(!slides.length)
        return;

    if(
        !confirm(
            'Tem certeza que deseja apagar todos os slides?'
        )
    ){

        return;

    }

    slides=[];

    document.getElementById(
        'slidesArea'
    ).innerHTML='';

    document.getElementById(
        'slidesStatus'
    ).innerHTML='';

    document.getElementById(
        'slideTexto'
    ).value='';

}


/* ================= BIBLIOTECA PDF ================= */

function carregarBibliotecaPDF(){

    return new Promise(
        (resolve,reject) => {

            if(
                window.jspdf &&
                window.jspdf.jsPDF
            ){

                resolve(
                    window.jspdf.jsPDF
                );

                return;

            }

            const script =
                document.createElement(
                    'script'
                );

            script.src =
                'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';

            script.onload = () => {

                if(
                    window.jspdf &&
                    window.jspdf.jsPDF
                ){

                    resolve(
                        window.jspdf.jsPDF
                    );

                }else{

                    reject(
                        new Error(
                            'Biblioteca PDF não carregada.'
                        )
                    );

                }

            };

            script.onerror = () => {

                reject(
                    new Error(
                        'Falha ao carregar biblioteca PDF.'
                    )
                );

            };

            document.head.appendChild(
                script
            );

        }
    );

}


/* ================= SALVAR PDF ================= */

async function salvarPDF(){

    try{

        const jsPDF =
            await carregarBibliotecaPDF();

        const pdf =
            new jsPDF();

        const texto =
            document
                .getElementById('editor')
                .innerText
                .trim();

        if(!texto){

            alert(
                'Digite algum texto antes de salvar o PDF.'
            );

            return;

        }

        const linhas =
            pdf.splitTextToSize(
                texto,
                180
            );

        let y=20;

        linhas.forEach(linha => {

            if(y > 280){

                pdf.addPage();

                y=20;

            }

            pdf.text(
                linha,
                15,
                y
            );

            y += 8;

        });

        pdf.save(
            'KFTools-texto.pdf'
        );

    }catch(erro){

        alert(
            'Não foi possível gerar o PDF.'
        );

        console.error(
            erro
        );

    }

}

/* ================= EXPORTAR SLIDES PDF ================= */

async function exportarSlidesPDF(){

    if(!slides.length){

        alert(
            'Crie pelo menos um slide primeiro.'
        );

        return;

    }

    try{

        const jsPDF =
            await carregarBibliotecaPDF();

        const pdf =
            new jsPDF({

                orientation:'landscape',

                unit:'mm',

                format:'a4'

            });

        slides.forEach(
            (slide,index) => {

                if(index > 0){

                    pdf.addPage();

                }

                const titulo =
                    slide.titulo ||
                    'Novo slide';

                const conteudo =
                    slide.conteudo ||
                    '';

                pdf.setFontSize(
                    26
                );

                pdf.text(
                    titulo,
                    15,
                    25
                );

                pdf.setFontSize(
                    15
                );

                const linhas =
                    pdf.splitTextToSize(
                        conteudo,
                        260
                    );

                let y=42;

                linhas.forEach(
                    linha => {

                        if(y > 185){

                            return;

                        }

                        pdf.text(
                            linha,
                            15,
                            y
                        );

                        y += 9;

                    }
                );

                pdf.setFontSize(
                    9
                );

                pdf.text(
                    `KFTools • Slide ${index+1}`,
                    15,
                    195
                );

            }
        );

        pdf.save(
            'KFTools-apresentacao.pdf'
        );

    }catch(erro){

        alert(
            'Não foi possível exportar os slides.'
        );

        console.error(
            erro
        );

    }

}


/* ================= INICIALIZAÇÃO ================= */

        try{

            const salvo =
                localStorage.getItem(
                    'KFToolsProjeto'
                );

            if(salvo){

                const projeto =
                    JSON.parse(
                        salvo
                    );

                if(
                    projeto &&
                    Array.isArray(
                        projeto.slides
                    )
                ){

                    slides =
                        projeto.slides;

                    estiloSlide =
                        projeto.estilo ||
                        'classic';

                    renderizarSlides();

                }

            }

        }catch(erro){

            console.log(

            );

        }

    }
);
